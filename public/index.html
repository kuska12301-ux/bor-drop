сте интереснее</p><div class="value">0</div><span class="sub">приглашённых друзей</span></div><div class="card"><b>Твоя ссылка</b><p class="sub">Будет доступна после подключения Telegram-бота.</p><button class="primary" data-info="Реферальная ссылка">Пригласить друга</button></div>'}else if(page==='transactions'){c='<h2>История операций</h2><div class="card">'+history()+'</div>'}else if(page==='market'){c='<h2>Маркет NFT</h2><p class="sub">Демонстрационная витрина · покупки недоступны</p><div class="market">'+['Crystal','Blue Star','Lucky Gift','Golden Heart'].map((n,i)=>'<div class="nft" style="filter:hue-rotate('+(i*40)+'deg)">'+ico('gem')+'<b>'+n+'</b><button class="primary" data-info="NFT '+n+'">Смотреть</button></div>').join('')+'</div>'}else if(page==='profile'){c=heading('Профиль')+'<div class="card" style="text-align:center"><div class="avatar" style="margin:auto">B</div><h2>Игрок BOR</h2><p class="sub">Локальный демонстрационный профиль</p><h1>'+st.balance.toFixed(2)+' <span class="unit">USD</span></h1></div><div class="card"><div class="row"><span>Игр</span><b>'+st.games+'</b></div><div class="row"><span>Побед</span><b>'+st.wins+'</b></div><div class="row"><span>Объём</span><b>'+st.volume.toFixed(2)+' USD</b></div></div>'}$('content').innerHTML=c;wire()}function history(){return st.history.length?st.history.slice(0,30).map(x=>'<div class="row"><span><b>'+x.label+'</b><br><small>'+new Date(x.time).toLocaleString('ru-RU')+'</small></span><b>'+((x.amount>0?'+':'')+x.amount.toFixed(2))+' USD</b></div>').join(''):empty('Операций пока нет')}function entry(type,label,amount){st.history.unshift({type,label,amount,time:Date.now()});st.history=st.history.slice(0,100)}let visited=new Set(['home']);function go(p){if(locked&&p==='game')return;page=p;visited.add(p);render();window.scrollTo(0,0)}function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>toast(b.da ;if(!Number.isFinite(n)||n<.01||n>st.balance)return toast('Проверь сумму ставки');st.balance=Math.round((st.balance-n)*100)/100;st.volume+=n;st.rake=(st.rake||0)+n*.005;entry('bet','Ставка · '+mode,-n);let p=players.find(x=>x.you);if(p)p.amount+=n;else players.push({name:'Ты',amount:n,you:true});render()};$('opponent').onclick=()=>{if(locked||players.length>=8)return;players.push({name:'Демо '+(players.length+1),amount:.1*(players.length+1)});render()};$('spin').onclick=()=>{if(locked||players.length<2)return;locked=true;let bank=players.reduce((s,p)=>s+p.amount,0),a=new Uint32Array(1);crypto.getRandomValues(a);let r=a[0]/4294967296*bank,total=0,w=players[0];for(let p of players){total+=p.amount;if(r<total){w=p;break}}render();let strip=document.querySelector('.strip');strip.style.background='repeating-linear-gradient(100deg,#c8edff,#c8edff 40px,#eff6ff 40px,#eff6ff 80px)';strip.animate([{backgroundPosition:'0 0'},{backgroundPosition:'1000px 0'}],{duration:2400,easing:'cubic-bezier(.1,.7,.2,1)'});setTimeout(()=>{if(w.you){st.balance+=bank;st.wins++;entry('win','Выигрыш · '+mode,bank)}st.games++;st.winner=w.name;st.lastBank=bank;players=[];locked=false;save();if(page==='game')render();toast('Победитель: '+w.name+' · '+bank.toFixed(2)+' USD')},2500)}}}document.querySelectorAll('.tabbar [data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('bor-drop-theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('bor-drop-theme')==='dark')document.body.classList.add('dark');render();
